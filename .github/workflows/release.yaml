name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      series:
        description: "codename=release entries to upload (PPA only, version from pyproject)"
        default: "jammy=22.04 noble=24.04 resolute=26.04 stonking=26.10"

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/colcon-dashboard
    permissions:
      id-token: write  # PyPI trusted publishing, no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  ppa:
    needs: build
    # run on manual dispatch too, where build is skipped
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    # the ppa environment holds the uploader key and pauses for approval
    environment:
      name: ppa
      url: https://launchpad.net/~xmfcx/+archive/ubuntu/colcon-dashboard
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper \
            dh-python dput pybuild-plugin-pyproject python3-all \
            python3-paramiko
      - name: Configure sftp uploads
        env:
          PPA_SSH_PRIVATE_KEY: ${{ secrets.PPA_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PPA_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # pin the host key against the fingerprint documented at
          # https://ubuntu.com/docs/launchpad/user/reference/ssh-fingerprints/
          ssh-keyscan -t rsa ppa.launchpad.net > "$RUNNER_TEMP/hostkey"
          ssh-keygen -lf "$RUNNER_TEMP/hostkey" \
            | grep -qF 'SHA256:MGq+4hxD7RduVTcfwlwwboZnsgJC6SL/NltM8ye+gNg'
          cat "$RUNNER_TEMP/hostkey" >> ~/.ssh/known_hosts
          cat > ~/.dput.cf <<EOF
          [ppa-sftp]
          fqdn = ppa.launchpad.net
          method = sftp
          login = xmfcx
          incoming = ~xmfcx/colcon-dashboard/ubuntu
          EOF
      - name: Import the upload key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build, sign, and upload the source packages
        env:
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          SERIES: ${{ inputs.series || 'jammy=22.04 noble=24.04 resolute=26.04 stonking=26.10' }}
        run: |
          upstream=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$upstream" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != version $upstream"; exit 1
          fi
          keyid=$(gpg --batch --list-secret-keys --with-colons \
                  | awk -F: '/^sec/{print $5; exit}')
          printf '%s\n' "$PPA_GPG_PASSPHRASE" > "$RUNNER_TEMP/pf"
          # ~ubuntuNN.NN.1 suffixes: release numbers sort reliably across
          # series; codenames wrap around the alphabet.
          for entry in $SERIES; do
            series="${entry%%=*}"
            version="${upstream}ppa1~ubuntu${entry#*=}.1"
            cat > debian/changelog <<EOF
          colcon-dashboard (${version}) ${series}; urgency=medium

            * New upstream release.

           -- Mete Fatih Cırıt <mfc@autoware.org>  $(date -R)
          EOF
            dpkg-buildpackage -S -sa -us -uc
            debsign -k"$keyid" \
              -p"gpg --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/pf" \
              "../colcon-dashboard_${version}_source.changes"
            for attempt in 1 2 3; do
              dput ppa-sftp \
                "../colcon-dashboard_${version}_source.changes" && break
              test "$attempt" != 3 || exit 1
              sleep 30
            done
            git checkout -- debian/changelog
          done
          rm -f "$RUNNER_TEMP/pf"
