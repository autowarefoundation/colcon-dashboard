[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colcon-dashboard"
version = "0.8.2"
description = "Live web dashboard for colcon builds: dependency graph, timeline, per-package logs, system pressure"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Mete Fatih Cırıt", email = "mfc@autoware.org" }]
license = { text = "Apache-2.0" }
keywords = ["colcon", "ros", "ros2", "build", "dashboard", "autoware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Repository = "https://github.com/autowarefoundation/colcon-dashboard"
Issues = "https://github.com/autowarefoundation/colcon-dashboard/issues"

[project.scripts]
colcon-dashboard = "colcon_dashboard.cli:main"

[tool.setuptools]
packages = ["colcon_dashboard"]

[tool.setuptools.package-data]
colcon_dashboard = ["static/*"]
