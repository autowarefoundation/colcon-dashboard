# Metadata lives here instead of a pyproject [project] table: Ubuntu
# 22.04 builds with setuptools 59, which needs setuptools >= 61 to read
# [project] and otherwise silently builds an UNKNOWN-0.0.0 wheel.
[metadata]
name = colcon-dashboard
version = attr: colcon_dashboard.__version__
description = Live web dashboard for colcon builds: dependency graph, timeline, per-package logs, system pressure
long_description = file: README.md
long_description_content_type = text/markdown
author = Mete Fatih Cırıt
author_email = mfc@autoware.org
license = Apache-2.0
keywords = colcon, ros, ros2, build, dashboard, autoware
url = https://github.com/autowarefoundation/colcon-dashboard
project_urls =
    Repository = https://github.com/autowarefoundation/colcon-dashboard
    Issues = https://github.com/autowarefoundation/colcon-dashboard/issues
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Topic :: Software Development :: Build Tools

[options]
packages = colcon_dashboard
python_requires = >=3.8

[options.package_data]
colcon_dashboard = static/*

[options.entry_points]
console_scripts =
    colcon-dashboard = colcon_dashboard.cli:main
